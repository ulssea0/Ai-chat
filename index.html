<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DreamVerse (ส่วนตัว)</title>
<style>
:root{--bg:#0d0b12;--panel:#171320;--line:#2a2338;--tx:#ece8f4;--mut:#9b92ad;--ac:#c04fd8;--ac2:#ff6fa8;--me:#2b1d3d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.65 "Sarabun","Noto Sans Thai",system-ui,sans-serif;display:flex}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.p{background:linear-gradient(90deg,var(--ac),var(--ac2));border:0;color:#fff}
input,textarea,select{width:100%;background:#100d17;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical}
label{display:block;margin:10px 0 3px;color:var(--mut);font-size:14px}
#side{width:270px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
#side h1{font-size:20px;margin:0;padding:16px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#list{flex:1;overflow:auto;padding:0 8px}
.ch{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.ch:hover,.ch.on{background:var(--me)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.ch small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
#side .foot{padding:10px;display:flex;gap:6px;flex-wrap:wrap}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
#top .sp{flex:1}
#menu{display:none}
#msgs{flex:1;overflow:auto;padding:20px 16px}
.w{max-width:760px;margin:0 auto 18px}
.m{padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.m.u{background:var(--me);margin-left:12%}
.m i{color:#c9a8e8}
.m .th{color:var(--mut)}
.act{display:flex;gap:4px;margin-top:4px;opacity:.55}
.act button{padding:1px 8px;font-size:13px;border:0;background:none}
.act button:hover{color:var(--ac2)}
#bar{padding:12px 16px;border-top:1px solid var(--line)}
#bar .w{display:flex;gap:8px;margin:0 auto;align-items:flex-end}
#inp{min-height:46px;max-height:160px}
.empty{color:var(--mut);text-align:center;margin-top:20vh}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:min(560px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#000b}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
@media(max-width:760px){#side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}#menu{display:block}.m.u{margin-left:0}}
</style>
</head>
<body>
<aside id="side">
  <h1>DreamVerse</h1>
  <div id="list"></div>
  <div class="foot"><button class="p" onclick="editChar()">+ ตัวละคร</button><button onclick="editPersona()">ตัวตนฉัน</button><button onclick="editCfg()">ตั้งค่า AI</button><button onclick="exp()">สำรอง</button></div>
</aside>
<section id="main">
  <div id="top"><button id="menu" onclick="side.classList.toggle('open')">☰</button><b id="title">เลือกตัวละคร</b><span class="sp"></span>
    <button onclick="editMem()">ความจำ</button><button onclick="editChar(S.cur)">แก้ตัวละคร</button><button onclick="clearChat()">เริ่มใหม่</button></div>
  <div id="msgs"><div class="empty">สร้างหรือเลือกตัวละครทางซ้ายเพื่อเริ่มเรื่อง</div></div>
  <div id="bar"><div class="w"><textarea id="inp" rows="1" placeholder="พิมพ์ เช่น *ยิ้ม* &quot;สวัสดี&quot;"></textarea><button class="p" id="go" onclick="send()">ส่ง</button></div></div>
</section>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),side=$('#side');
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let S;
try{S=JSON.parse(localStorage.getItem('dv'))}catch(e){}
S=S||{cfg:{base:'http://localhost:11434/v1',key:'',model:'llama3.1'},chars:[],persona:{name:'ฉัน',desc:''},chats:{},cur:null};
const save=()=>{try{localStorage.setItem('dv',JSON.stringify(S))}catch(e){alert('พื้นที่เก็บเต็ม ลองกด "สำรอง" แล้วลบแชตเก่า')}};
const chat=id=>S.chats[id]||(S.chats[id]={msgs:[],mem:[],sum:'',upto:0});
const cur=()=>S.chars.find(c=>c.id===S.cur);
let busy=false,ctl=null;

function renderList(){
  $('#list').innerHTML=S.chars.map(c=>`<div class="ch ${c.id===S.cur?'on':''}" onclick="pick('${c.id}')"><div class="av">${c.img?`<img src="${c.img}">`:esc(c.name[0]||'?')}</div><div><b>${esc(c.name)}</b><small>${esc(c.tag||'')}</small></div></div>`).join('')||'<p class="empty" style="margin:20px 0">ยังไม่มีตัวละคร</p>';
}
function pick(id){S.cur=id;save();side.classList.remove('open');const c=cur(),h=chat(id);
  if(!h.msgs.length&&c.greet){h.msgs.push({r:'assistant',t:c.greet});save()}
  renderList();renderMsgs()}
function fmt(t){return esc(t).replace(/\*([^*\n]+)\*/g,'<i>*$1*</i>').replace(/\(([^)\n]+)\)/g,'<span class="th">($1)</span>')}
function renderMsgs(){
  const c=cur();if(!c){return}
  $('#title').textContent=c.name;const h=chat(c.id);
  $('#msgs').innerHTML=h.msgs.map((m,i)=>`<div class="w"><div class="m ${m.r==='user'?'u':''}" id="m${i}">${fmt(m.t)}</div><div class="act" ${m.r==='user'?'style="justify-content:flex-end"':''}><button onclick="editMsg(${i})">แก้ไข</button><button onclick="delFrom(${i})">ลบจากตรงนี้</button>${i===h.msgs.length-1&&m.r==='assistant'?'<button onclick="regen()">สร้างใหม่</button><button onclick="cont()">เล่าต่อ</button>':''}</div></div>`).join('');
  $('#msgs').scrollTop=1e9}

function sysPrompt(c){
  const p=S.persona,h=chat(c.id);
  return `You are playing the fictional character "${c.name}" in an interactive novel-style roleplay with the user, whose character is "${p.name}".
RULES: Stay in character; keep personality, speech style and emotions consistent and driven by context. Write vivid, novel-like replies (several sentences to a few paragraphs): dialogue in "quotes", actions in *asterisks*, inner thoughts in (parentheses). Never write the user's lines, actions or decisions. Advance the story with new details or events. Avoid repeating phrases. Every character is an adult (18+). Reply in the user's language (Thai by default).
CHARACTER: ${c.desc||''}
PERSONALITY/SPEECH: ${c.pers||''}
BACKSTORY & RELATIONSHIP TO USER: ${c.back||''}
SCENARIO: ${c.scen||''}
EXTRA RULES: ${c.rules||''}
USER PERSONA: ${p.desc||''}
${h.sum?'STORY SO FAR (summary): '+h.sum:''}
${h.mem.length?'IMPORTANT MEMORIES: '+h.mem.join('; '):''}`}

async function llm(messages,onTok,signal){
  const {base,key,model}=S.cfg;
  const r=await fetch(base.replace(/\/$/,'')+'/chat/completions',{method:'POST',signal,headers:{'Content-Type':'application/json',...(key?{Authorization:'Bearer '+key}:{})},body:JSON.stringify({model,messages,stream:!!onTok,temperature:.9})});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,300));
  if(!onTok)return (await r.json()).choices[0].message.content;
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',out='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
      try{const t=JSON.parse(d).choices[0].delta.content;if(t){out+=t;onTok(out)}}catch(e){}}}
  return out}

async function reply(){
  const c=cur(),h=chat(c.id);busy=true;$('#go').textContent='หยุด';
  h.msgs.push({r:'assistant',t:'…'});renderMsgs();
  const idx=h.msgs.length-1,el=$('#m'+idx);
  const ctx=[{role:'system',content:sysPrompt(c)},...h.msgs.slice(Math.max(h.upto,h.msgs.length-21),idx).map(m=>({role:m.r,content:m.t}))];
  ctl=new AbortController();
  try{
    const t=await llm(ctx,x=>{el.innerHTML=fmt(x);$('#msgs').scrollTop=1e9},ctl.signal);
    h.msgs[idx].t=t||'(ไม่มีคำตอบ)';
  }catch(e){
    if(e.name==='AbortError'){h.msgs[idx].t=el.textContent==='…'?'(หยุดแล้ว)':el.textContent}
    else{h.msgs.pop();alert('เรียก AI ไม่ได้: '+e.message+'\nตรวจ "ตั้งค่า AI" และตรวจว่า Ollama/เซิร์ฟเวอร์เปิดอยู่')}
  }
  busy=false;$('#go').textContent='ส่ง';save();renderMsgs();summarize(c)}

async function summarize(c){
  const h=chat(c.id),end=h.msgs.length-12;
  if(end-h.upto<24)return;
  try{
    const part=h.msgs.slice(h.upto,end).map(m=>(m.r==='user'?S.persona.name:c.name)+': '+m.t).join('\n');
    h.sum=await llm([{role:'system',content:'Summarize the roleplay so far in under 250 words, in Thai. Keep key events, promises, relationship changes, emotions, facts.'},{role:'user',content:'Previous summary: '+h.sum+'\n\nNew events:\n'+part}]);
    h.upto=end;save()}catch(e){}}

function send(){
  if(busy){ctl&&ctl.abort();return}
  const c=cur();if(!c)return alert('เลือกตัวละครก่อน');
  const v=$('#inp').value.trim();if(!v)return;
  chat(c.id).msgs.push({r:'user',t:v});$('#inp').value='';save();reply()}
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>760){e.preventDefault();send()}});
function regen(){if(busy)return;const h=chat(S.cur);h.msgs.pop();reply()}
function cont(){if(busy)return;chat(S.cur).msgs.push({r:'user',t:'(เล่าเรื่องต่อไป โดยไม่ต้องรอการกระทำจากฉัน)'});reply()}
function delFrom(i){if(busy||!confirm('ลบข้อความตั้งแต่ตรงนี้ลงไป?'))return;chat(S.cur).msgs.length=i;save();renderMsgs()}
function editMsg(i){const h=chat(S.cur);const t=prompt('แก้ไขข้อความ',h.msgs[i].t);if(t!==null){h.msgs[i].t=t;save();renderMsgs()}}
function clearChat(){if(!cur()||!confirm('เริ่มแชตใหม่ (ลบประวัติและความจำของตัวละครนี้)?'))return;delete S.chats[S.cur];save();pick(S.cur)}

function modal(html,ok){const d=$('#dlg');d.innerHTML=`<form method="dialog" onsubmit="return false">${html}<div class="row"><button type="button" onclick="dlg.close()">ปิด</button><button type="button" class="p" id="okb">บันทึก</button></div></form>`;
  $('#okb').onclick=()=>{ok();d.close()};d.showModal()}
const dlg=$('#dlg'),g=id=>document.getElementById(id).value;
function editChar(id){
  const c=S.chars.find(x=>x.id===id)||{};
  if(id&&!c.id)return alert('เลือกตัวละครก่อน');
  const f=(k,l,r=2)=>`<label>${l}</label><textarea id="f_${k}" rows="${r}">${esc(c[k]||'')}</textarea>`;
  modal(`<h3>${c.id?'แก้ไข':'สร้าง'}ตัวละคร</h3><label>ชื่อ</label><input id="f_name" value="${esc(c.name||'')}"><label>คำโปรย</label><input id="f_tag" value="${esc(c.tag||'')}">`+
   f('desc','ลักษณะภายนอก / อายุ (ต้อง 18+) / อาชีพ')+f('pers','บุคลิก นิสัย วิธีพูด สิ่งที่ชอบ/ไม่ชอบ',3)+f('back','ประวัติ ความลับ และความสัมพันธ์กับฉัน',3)+f('scen','สถานการณ์เริ่มต้น')+f('greet','คำทักทายแรก',3)+f('rules','กฎเฉพาะของตัวละคร')+
   `<label>รูปโปรไฟล์</label><input type="file" id="f_file" accept="image/*">`+(c.id?'<div class="row" style="justify-content:flex-start"><button type="button" onclick="delChar()">ลบตัวละครนี้</button></div>':''),
  ()=>{const n={...c,id:c.id||'c'+Date.now()};['name','tag','desc','pers','back','scen','greet','rules'].forEach(k=>n[k]=g('f_'+k));
    if(!n.name.trim())return;
    const fin=()=>{const i=S.chars.findIndex(x=>x.id===n.id);i<0?S.chars.push(n):S.chars[i]=n;S.cur=n.id;save();pick(n.id)};
    const fl=$('#f_file').files[0];
    if(!fl)return fin();
    const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=96;const x=cv.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);n.img=cv.toDataURL('image/jpeg',.8);fin()};im.src=URL.createObjectURL(fl)})}
function delChar(){if(!confirm('ลบตัวละครและแชตทั้งหมด?'))return;S.chars=S.chars.filter(c=>c.id!==S.cur);delete S.chats[S.cur];S.cur=null;save();dlg.close();renderList();$('#title').textContent='เลือกตัวละคร';$('#msgs').innerHTML='<div class="empty">เลือกตัวละครทางซ้าย</div>'}
function editPersona(){const p=S.persona;modal(`<h3>ตัวตนของฉันในเรื่อง</h3><label>ชื่อ</label><input id="p_n" value="${esc(p.name)}"><label>รายละเอียด (อายุ 18+ รูปลักษณ์ นิสัย อาชีพ ประวัติ)</label><textarea id="p_d" rows="6">${esc(p.desc)}</textarea>`,()=>{S.persona={name:g('p_n')||'ฉัน',desc:g('p_d')};save()})}
function editCfg(){const c=S.cfg;modal(`<h3>ตั้งค่า AI (ใช้ API แบบ OpenAI-compatible)</h3><label>Base URL</label><input id="c_b" value="${esc(c.base)}"><label>API Key (เว้นว่างได้ถ้าใช้ Ollama)</label><input id="c_k" type="password" value="${esc(c.key)}"><label>ชื่อโมเดล</label><input id="c_m" value="${esc(c.model)}"><p style="color:var(--mut);font-size:14px">คีย์เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น เหมาะกับใช้ส่วนตัวเท่านั้น ห้ามเผยแพร่ไฟล์นี้พร้อมคีย์</p>`,()=>{S.cfg={base:g('c_b'),key:g('c_k'),model:g('c_m')};save()})}
function editMem(){const c=cur();if(!c)return;const h=chat(c.id);modal(`<h3>ความจำของ ${esc(c.name)}</h3><label>เหตุการณ์/คำสัญญาสำคัญ (บรรทัดละ 1 ข้อ — AI จะจำเสมอ)</label><textarea id="mm" rows="6">${esc(h.mem.join('\n'))}</textarea><label>สรุปเรื่องที่ผ่านมา (สร้างอัตโนมัติ แก้ได้)</label><textarea id="ms" rows="6">${esc(h.sum)}</textarea>`,()=>{h.mem=g('mm').split('\n').map(s=>s.trim()).filter(Boolean);h.sum=g('ms');save()})}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='dreamverse-backup.json';a.click()}
renderList();if(S.cur&&cur())renderMsgs();
</script>
</body>
</html>
